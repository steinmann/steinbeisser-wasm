<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Steinbeisser</title>
    <link rel="stylesheet" href="./style.css?build=__BUILD_ID__" />
  </head>
  <body>
    <main class="app-shell">
      <section class="board-section">
        <div class="board-area">
          <div class="eval-rail">
            <div class="eval-bar" aria-hidden="true">
              <div class="eval-fill" data-eval-fill></div>
              <div class="eval-label" data-eval-label></div>
            </div>
          </div>
          <div class="board-stack">
            <div class="board-frame" data-board></div>
            <div class="thinking-dots board-thinking-dots" data-thinking-dots hidden aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </section>

      <aside class="control-panel">
        <div class="control-group">
          <button class="control-button" type="button" data-action="demo">Self-play</button>
          <button class="control-button" type="button" data-action="toggle-side">Play white</button>
          <button class="control-button" type="button" data-action="reset">Reset</button>
          <button class="control-button" type="button" data-action="takeback">Take back</button>
          <button class="control-button" type="button" data-action="edit-position">Edit</button>
          <label class="position-editor" data-position-editor hidden>
            <span class="fen-label">FEN</span>
            <input
              class="fen-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Paste FEN"
              data-position-input
            />
          </label>
        </div>

        <div class="control-group search-settings">
          <label class="setting-field">
            <span class="setting-header">
              <span class="setting-label">Max depth</span>
              <button
                class="toggle-switch"
                type="button"
                data-toggle="depth-limit"
                aria-pressed="false"
                aria-label="Toggle depth limit"
              >
                <span class="toggle-thumb"></span>
              </button>
            </span>
            <input
              class="setting-input"
              type="number"
              min="1"
              max="64"
              step="1"
              value="17"
              inputmode="numeric"
              data-setting="max-depth"
            />
          </label>
          <label class="setting-field">
            <span class="setting-header">
              <span class="setting-label">Max seconds</span>
              <button
                class="toggle-switch"
                type="button"
                data-toggle="time-limit"
                aria-pressed="true"
                aria-label="Toggle time limit"
              >
                <span class="toggle-thumb"></span>
              </button>
            </span>
            <input
              class="setting-input"
              type="number"
              min="0.1"
              max="600"
              step="0.1"
              value="3"
              inputmode="numeric"
              data-setting="max-time-seconds"
            />
          </label>
          <div class="setting-field debug-setting">
            <span class="setting-header">
              <span class="setting-label">Debug</span>
              <button
                class="toggle-switch"
                type="button"
                data-toggle="debug"
                aria-pressed="false"
                aria-label="Toggle debug"
              >
                <span class="toggle-thumb"></span>
              </button>
            </span>
            <div class="debug-panel" data-debug-panel hidden>
              <table class="debug-table" aria-label="Engine debug information">
                <tbody>
                  <tr>
                    <th scope="row">Depth</th>
                    <td data-debug-depth></td>
                  </tr>
                  <tr>
                    <th scope="row">Speed</th>
                    <td data-debug-speed></td>
                  </tr>
                  <tr>
                    <th scope="row">Time</th>
                    <td data-debug-time></td>
                  </tr>
                  <tr>
                    <th scope="row">Nodes</th>
                    <td data-debug-nodes></td>
                  </tr>
                  <tr>
                    <th scope="row">Ply</th>
                    <td data-debug-ply></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="status-panel">
          <p class="search-info-text" data-search-info hidden></p>
          <p class="notice-text" data-notice></p>
        </div>
      </aside>
    </main>

    <script type="module" src="./main.js?build=__BUILD_ID__"></script>
  </body>
</html>
