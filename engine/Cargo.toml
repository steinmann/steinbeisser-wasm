[package]
name = "steinbeisser-wasm-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-time = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
