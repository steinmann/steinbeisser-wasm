name: Deploy Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Resolve wasm-bindgen-cli version
        id: wasm-bindgen-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          lock_path = Path("engine/Cargo.lock")
          lines = lock_path.read_text().splitlines()

          for i, line in enumerate(lines):
              if line.strip() == 'name = "wasm-bindgen"':
                  for entry in lines[i + 1 : i + 8]:
                      if entry.startswith("version = "):
                          print(f"version={entry.split(chr(34))[1]}")
                          raise SystemExit

          raise SystemExit("Could not find wasm-bindgen version in engine/Cargo.lock")
          PY

      - name: Install matching wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "${{ steps.wasm-bindgen-version.outputs.version }}"

      - name: Build site
        run: ./scripts/build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
